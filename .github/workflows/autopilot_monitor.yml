name: Intraday Auto-Pilot Price & TP/SL Monitor

on:
  schedule:
    # Lun-Ven ogni 2 ore durante la sessione US (14:30 - 20:30 UTC) — zero PC acceso
    - cron: "30 14,16,18,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Concurrency condivisa con daily_scouter.yml per evitare race/conflitti sui commit dello store
concurrency:
  group: "scouter-state-writer"
  cancel-in-progress: false

jobs:
  monitor-autopilot:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit_state.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure optional Firebase Service Account
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            printf '%s' "$FIREBASE_SA" > backend/firebase-sa.json
            echo "FIREBASE_SERVICE_ACCOUNT_PATH=firebase-sa.json" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_SERVICE_ACCOUNT_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Run Lightweight Live Price & TP/SL Monitor
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scouter_pipeline.py --monitor-only

      - name: Clean temporary Firebase key file
        if: always()
        run: rm -f backend/firebase-sa.json

      - name: Commit updated checkpoints & static snapshot
        id: commit_state
        run: |
          git config user.name "scouter-autopilot-bot"
          git config user.email "scouter-bot@users.noreply.github.com"
          git add backend/data/scouter_store.json frontend/public/scouter_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): intraday autopilot monitor update [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No monitor changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: monitor-autopilot
    if: success() && needs.monitor-autopilot.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_pages.yml
